    <script src="script.js" defer></script>
    <script>
    (function () {
        var container = document.getElementById('success-content');
        var params = new URLSearchParams(window.location.search);
        var sessionId = params.get('session_id');

        if (!sessionId) {
            container.innerHTML = '<p>No purchase session found.</p><p><a href="index.html">Back to home</a></p>';
            return;
        }

        fetch('/api/checkout-session/' + encodeURIComponent(sessionId))
            .then(function (res) { return res.json(); })
            .then(function (data) {
                if (data.error) {
                    container.innerHTML = '<p>Could not load purchase details.</p><p><a href="index.html">Back to home</a></p>';
                    return;
                }

                var productName = data.metadata.productName || 'Font license';
                var total = ((data.amountTotal || 0) / 100).toFixed(2);
                var currency = (data.currency || 'eur').toUpperCase();
                var license = data.metadata.licenseTier || '';

                var html = '<p>Thank you for your purchase!</p>';
                html += '<div class="success-details">';
                html += '<div class="success-row"><span>Product</span><span>' + productName + '</span></div>';
                if (license) {
                    html += '<div class="success-row"><span>License</span><span>' + license + '</span></div>';
                }
                html += '<div class="success-row success-total"><span>Total paid</span><span>' + total + ' ' + currency + '</span></div>';
                html += '</div>';

                if (data.downloadToken) {
                    html += '<p>Your download includes all font files and an invoice.</p>';
                    html += '<a href="/api/download/' + encodeURIComponent(data.downloadToken) + '" class="success-download-btn">Download fonts + invoice</a>';
                    html += '<p class="success-note">This download link expires in 48 hours. Revisit this page to generate a new one.<br>Questions? Contact us at <a href="mailto:hi@indigoindigo.org">hi@indigoindigo.org</a>.</p>';
                } else {
                    html += '<p class="success-note">Payment is still processing. Please refresh this page in a moment.<br>Questions? Contact us at <a href="mailto:hi@indigoindigo.org">hi@indigoindigo.org</a>.</p>';
                }

                html += '<p><a href="index.html">Back to home</a></p>';

                container.innerHTML = html;
            })
            .catch(function () {
                container.innerHTML = '<p>Could not load purchase details. Please try refreshing.</p><p><a href="index.html">Back to home</a></p>';
            });
    })();
    </script>
