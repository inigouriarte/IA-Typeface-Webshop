<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typeface Samples (data/typeface-samples.json)</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1 {
            color: #333;
        }
        .info-box {
            background: #f0f0f0;
            border-left: 4px solid #4CAF50;
            padding: 15px;
            margin: 20px 0;
        }
        .warning-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin: 20px 0;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
            margin: 10px 5px;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        #output {
            margin-top: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 500px;
            overflow-y: auto;
        }
        .success {
            color: #4CAF50;
        }
        .error {
            color: #f44336;
        }
        code {
            background: #f4f4f4;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>Typeface Samples</h1>
    
    <div class="info-box">
        <strong>ℹ️ Data source:</strong>
        <p>Samples are read from <code>data/typeface-samples.json</code>. To update:</p>
        <ul>
            <li><strong>View</strong> – see what’s currently in the JSON file.</li>
            <li><strong>Export</strong> – download <code>typeface-samples.json</code> from the in-script data; save it as <code>data/typeface-samples.json</code> in your project to update.</li>
        </ul>
    </div>

    <button id="insertBtn" onclick="runInsert()">Export typeface-samples.json</button>
    <button onclick="viewSamples()">View Existing Samples</button>
    
    <div id="output"></div>

    <script src="insert-typeface-samples.js"></script>
    
    <script>
        const output = document.getElementById('output');
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : '';
            output.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            output.scrollTop = output.scrollHeight;
        }

        async function runInsert() {
            const btn = document.getElementById('insertBtn');
            btn.disabled = true;
            output.innerHTML = '';
            log('Exporting typeface samples...', 'info');
            
            try {
                const data = await insertTypefaceSamples();
                log(`Exported ${data.length} typeface families.`, 'success');
                log('Save the downloaded file as data/typeface-samples.json in your project.', 'info');
            } catch (error) {
                log(`Fatal error: ${error.message}`, 'error');
                console.error(error);
            } finally {
                btn.disabled = false;
            }
        }

        async function viewSamples() {
            output.innerHTML = '';
            log('Fetching existing samples...', 'info');
            
            try {
                const samples = await getTypefaceSamples();
                
                if (samples.length === 0) {
                    log('No samples found in data/typeface-samples.json.', 'info');
                    return;
                }
                
                log(`Found ${samples.length} typeface family/families:\n`, 'success');
                
                samples.forEach(item => {
                    log(`\n${item.family_name}:`, 'success');
                    log(`  Samples: ${item.sample_texts.length} text(s)`);
                    item.sample_texts.forEach((sample, idx) => {
                        log(`    ${idx + 1}. Type: ${sample.sampleType}, Size: ${sample.fontSize}px, Tracking: ${sample.letterSpacing}px`);
                        log(`       Text: ${sample.text.substring(0, 60)}${sample.text.length > 60 ? '...' : ''}`);
                    });
                });
            } catch (error) {
                log(`Error: ${error.message}`, 'error');
                console.error(error);
            }
        }
    </script>
</body>
</html>
